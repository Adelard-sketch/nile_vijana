  <line x1="244" y1="60" x2="244" y2="300" stroke="#f0a232" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
  <circle cx="244" cy="60" r="5" fill="#f0a232"/>
  <!-- BPM label -->
  <rect x="20" y="20" width="72" height="28" rx="8" fill="rgba(240,162,50,0.15)" stroke="rgba(240,162,50,0.4)" stroke-width="1"/>
  <text x="56" y="38" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#f0a232" text-anchor="middle">140 BPM</text>
  <!-- KEY label -->
  <rect x="102" y="20" width="52" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="128" y="38" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="rgba(247,243,238,0.7)" text-anchor="middle">A min</text>
  <!-- bottom fade -->
  <rect width="640" height="80" y="280" fill="url(#bg)" opacity="0.6"/>
