<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1206"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a232"/>
      <stop offset="1" stop-color="#c2286f"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb84d" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f0a232" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- grid lines -->
  <line x1="0" y1="180" x2="640" y2="180" stroke="rgba(240,162,50,0.08)" stroke-width="1"/>
  <line x1="0" y1="90"  x2="640" y2="90"  stroke="rgba(240,162,50,0.05)" stroke-width="1"/>
  <line x1="0" y1="270" x2="640" y2="270" stroke="rgba(240,162,50,0.05)" stroke-width="1"/>
  <!-- waveform bars: mirrored around y=180 -->
  <!-- bar heights as pairs: [topH, bottomH] -->
