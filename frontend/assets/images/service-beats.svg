    <rect x="286" y="152" width="8" height="56" rx="4"/>
    <rect x="300" y="96"  width="8" height="168" rx="4"/>
    <rect x="314" y="128" width="8" height="104" rx="4"/>
    <rect x="328" y="148" width="8" height="64" rx="4"/>
    <rect x="342" y="112" width="8" height="136" rx="4"/>
    <rect x="356" y="136" width="8" height="88" rx="4"/>
    <rect x="370" y="104" width="8" height="152" rx="4"/>
    <rect x="384" y="142" width="8" height="76" rx="4"/>
