<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061208"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="cglow1" cx="30%" cy="40%" r="40%">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cglow2" cx="75%" cy="65%" r="35%">
      <stop offset="0" stop-color="#7a0b47" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7a0b47" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#cbg)"/>
  <circle cx="200" cy="150" r="180" fill="url(#cglow1)"/>
  <circle cx="460" cy="230" r="150" fill="url(#cglow2)"/>
  <!-- artist cards -->
  <!-- card 1 -->
  <rect x="40" y="60" width="160" height="200" rx="16" fill="rgba(22,27,34,0.9)" stroke="rgba(63,185,80,0.25)" stroke-width="1"/>
  <rect x="40" y="60" width="160" height="110" rx="16" fill="rgba(63,185,80,0.12)"/>
  <circle cx="120" cy="115" r="34" fill="rgba(63,185,80,0.2)" stroke="rgba(63,185,80,0.4)" stroke-width="2"/>
  <text x="120" y="123" font-size="26" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-weight="700">A</text>
  <rect x="60" y="192" width="120" height="10" rx="5" fill="rgba(255,255,255,0.15)"/>
  <rect x="75" y="210" width="90"  height="8"  rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="55" y="232" width="50"  height="16" rx="8" fill="rgba(63,185,80,0.2)"/>
  <text x="80" y="244" font-size="9" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-weight="700">ARTIST</text>
  <!-- card 2 (centre, elevated) -->
  <rect x="230" y="30" width="180" height="230" rx="16" fill="rgba(22,27,34,0.95)" stroke="rgba(224,86,154,0.35)" stroke-width="1.5"/>
  <rect x="230" y="30" width="180" height="130" rx="16" fill="rgba(122,11,71,0.25)"/>
  <circle cx="320" cy="95" r="40" fill="rgba(224,86,154,0.2)" stroke="rgba(224,86,154,0.5)" stroke-width="2"/>
  <text x="320" y="104" font-size="30" text-anchor="middle" fill="#e0569a" font-family="system-ui,sans-serif" font-weight="700">N</text>
  <rect x="250" y="182" width="140" height="11" rx="5" fill="rgba(255,255,255,0.18)"/>
  <rect x="265" y="202" width="110" height="9"  rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="248" y="224" width="70"  height="18" rx="9" fill="rgba(224,86,154,0.2)"/>
  <text x="283" y="237" font-size="9" text-anchor="middle" fill="#e0569a" font-family="system-ui,sans-serif" font-weight="700">VOCALIST</text>
  <!-- follow badge -->
  <rect x="358" y="224" width="44" height="18" rx="9" fill="rgba(224,86,154,0.9)"/>
  <text x="380" y="237" font-size="9" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="700">Follow</text>
  <!-- card 3 -->
  <rect x="440" y="80" width="160" height="200" rx="16" fill="rgba(22,27,34,0.9)" stroke="rgba(88,166,255,0.25)" stroke-width="1"/>
  <rect x="440" y="80" width="160" height="110" rx="16" fill="rgba(88,166,255,0.1)"/>
  <circle cx="520" cy="135" r="34" fill="rgba(88,166,255,0.15)" stroke="rgba(88,166,255,0.4)" stroke-width="2"/>
  <text x="520" y="143" font-size="26" text-anchor="middle" fill="#58a6ff" font-family="system-ui,sans-serif" font-weight="700">P</text>
  <rect x="460" y="212" width="120" height="10" rx="5" fill="rgba(255,255,255,0.15)"/>
  <rect x="475" y="230" width="90"  height="8"  rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="455" y="252" width="62"  height="16" rx="8" fill="rgba(88,166,255,0.2)"/>
  <text x="486" y="264" font-size="9" text-anchor="middle" fill="#58a6ff" font-family="system-ui,sans-serif" font-weight="700">PRODUCER</text>
  <!-- bottom fade -->
  <rect width="640" height="70" y="290" fill="url(#cbg)" opacity="0.7"/>
</svg>
