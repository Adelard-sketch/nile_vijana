<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0612"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="upink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0569a"/>
      <stop offset="1" stop-color="#7a0b47"/>
    </linearGradient>
    <radialGradient id="uglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c2286f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2286f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#ubg)"/>
  <circle cx="320" cy="180" r="200" fill="url(#uglow)"/>
  <!-- dashed upload circle -->
  <circle cx="320" cy="180" r="110" fill="none" stroke="rgba(224,86,154,0.2)" stroke-width="1" stroke-dasharray="6 5"/>
  <circle cx="320" cy="180" r="80" fill="rgba(194,40,111,0.1)" stroke="rgba(224,86,154,0.3)" stroke-width="1"/>
  <!-- upload arrow -->
  <line x1="320" y1="220" x2="320" y2="140" stroke="url(#upink)" stroke-width="4" stroke-linecap="round"/>
  <polyline points="296,164 320,140 344,164" fill="none" stroke="url(#upink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- base line -->
  <line x1="295" y1="228" x2="345" y2="228" stroke="rgba(224,86,154,0.6)" stroke-width="3" stroke-linecap="round"/>
  <!-- orbiting music notes -->
  <g opacity="0.7">
    <text x="174" y="120" font-size="22" fill="#f0a232" font-family="serif">♪</text>
    <text x="438" y="140" font-size="18" fill="#e0569a" font-family="serif">♫</text>
    <text x="160" y="240" font-size="14" fill="#e0569a" font-family="serif">♩</text>
    <text x="454" y="250" font-size="20" fill="#f0a232" font-family="serif">♪</text>
    <text x="300" y="80"  font-size="14" fill="rgba(224,86,154,0.5)" font-family="serif">♫</text>
    <text x="358" y="300" font-size="16" fill="rgba(240,162,50,0.5)" font-family="serif">♩</text>
  </g>
  <!-- earnings chips -->
  <rect x="30" y="150" width="90" height="30" rx="15" fill="rgba(63,185,80,0.15)" stroke="rgba(63,185,80,0.35)" stroke-width="1"/>
  <text x="75" y="170" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#3fb950" text-anchor="middle">+2,400 GHS</text>
  <rect x="520" y="170" width="88" height="30" rx="15" fill="rgba(240,162,50,0.15)" stroke="rgba(240,162,50,0.35)" stroke-width="1"/>
  <text x="564" y="190" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f0a232" text-anchor="middle">842 streams</text>
  <!-- bottom fade -->
  <rect width="640" height="70" y="290" fill="url(#ubg)" opacity="0.7"/>
</svg>
